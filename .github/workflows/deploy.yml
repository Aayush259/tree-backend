name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/tree-backend || { echo "Directory not found, cloning..."; git clone https://github.com/${{ github.repository }}.git ~/tree-backend && cd ~/tree-backend; }
            git pull origin main
            
            # Setup/Update Virtual Environment
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Database Migrations and Static Files
            python manage.py migrate
            python manage.py collectstatic --noinput
            
            # Ensure Docker Compose (Database only) is running
            docker compose up -d
            
            # Restart Gunicorn
            # 1. Kill any existing gunicorn processes
            pkill gunicorn || true
            
            # 2. Start Gunicorn in the background
            # We use nohup to keep it running after the SSH session closes
            nohup gunicorn --bind 0.0.0.0:8000 tree.wsgi:application > gunicorn.log 2>&1 &
            
            echo "Deployment successful. Gunicorn restarted."
